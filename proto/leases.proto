syntax = "proto3";

package chainbook;

option php_namespace = "App\\Grpc\\Generated";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

service LeaseService {
  rpc GetLeases (GetLeasesRequest) returns (LeasesResponse);
  rpc GetLease (GetLeaseRequest) returns (LeaseResponse);
  rpc CreateLease (CreateLeaseRequest) returns (LeaseResponse);
  rpc UpdateLease (UpdateLeaseRequest) returns (LeaseResponse);
  rpc ModifyLease (LeaseActionRequest) returns (LeaseResponse);
  rpc ImpairLease (LeaseActionRequest) returns (LeaseResponse);
  rpc ReverseLeaseImpairment (LeaseActionRequest) returns (LeaseResponse);
  rpc TerminateLease (LeaseActionRequest) returns (LeaseResponse);
  rpc GetLeaseSchedule (GetLeaseRequest) returns (ScheduleResponse);
  rpc WatchLeaseEvents (WatchRequest) returns (stream LeaseEventUpdate);
}

message GetLeasesRequest {
  int64 company_id = 1;
  string role = 2;
  string classification = 3;
  string status = 4;
}

message GetLeaseRequest {
  int64 id = 1;
}

message CreateLeaseRequest {
  string data_json = 1;
}

message UpdateLeaseRequest {
  int64 id = 1;
  string data_json = 2;
}

message LeaseActionRequest {
  int64 id = 1;
  string data_json = 2;
}

message LeaseResponse {
  string data = 1;
  string message = 2;
}

message LeasesResponse {
  string data = 1;
}

message ScheduleResponse {
  string data = 1;
}

message WatchRequest {
  int64 company_id = 1;
}

message LeaseEventUpdate {
  int64 lease_id = 1;
  int64 event_id = 2;
  string type = 3;
  string journal_status = 4;
  string lease_name = 5;
  string timestamp = 6;
}
