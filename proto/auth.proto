syntax = "proto3";

package chainbook;

option php_namespace = "App\\Grpc\\Generated";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc GetAuthStatus (Empty) returns (AuthStatusResponse);
}

message Empty {}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_name = 3;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
}

message AuthStatusResponse {
  bool authenticated = 1;
  string message = 2;
}
